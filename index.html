<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Setoran Hafalan - Admin Panel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#0ea5e9', // Sky blue 500 for Admin distinction
                        secondary: '#0369a1', // Sky blue 700
                    }
                }
            }
        }
    </script>
    <style>
        /* Menyembunyikan scrollbar bawaan agar lebih mirip aplikasi HP asli */
        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .hide-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>
<body class="bg-slate-200 text-slate-800 font-sans min-h-screen flex justify-center">

    <!-- Mobile App Container -->
    <div class="w-full max-w-md bg-slate-50 min-h-screen relative shadow-2xl flex flex-col pb-24">

        <!-- Header Mobile Style -->
        <header class="bg-slate-900 text-white shadow-md sticky top-0 z-50 rounded-b-xl">
            <div class="px-5 py-4 flex justify-between items-center">
                <div class="flex items-center gap-3">
                    <i class="fas fa-shield-alt text-2xl text-primary drop-shadow-md"></i>
                    <h1 class="text-xl font-bold tracking-wide">Admin Hafalan</h1>
                </div>
            </div>
        </header>

        <!-- Main Content Area -->
        <main class="flex-1 p-4 overflow-y-auto hide-scrollbar">

            <!-- Tab: Review Setoran -->
            <section id="tab-review" class="block animate-fade-in">
                <div class="flex justify-between items-center mb-4 border-b pb-2">
                    <h2 class="text-xl font-bold text-slate-800">Daftar Setoran</h2>
                    <button onclick="loadSetoran()" class="text-primary hover:text-secondary text-sm font-medium"><i class="fas fa-sync-alt"></i> Refresh</button>
                </div>
                
                <div id="admin-setoran-container" class="space-y-4">
                    <!-- Data setoran dimuat via JS -->
                </div>
            </section>

            <!-- Tab: Kelola Jadwal -->
            <section id="tab-jadwal" class="hidden animate-fade-in">
                <h2 class="text-xl font-bold mb-4 text-slate-800 border-b pb-2">Kelola Jadwal Kajian</h2>
                
                <!-- Form Tambah Jadwal -->
                <div class="bg-white p-5 rounded-xl shadow-sm border mb-6">
                    <h3 class="font-bold mb-3 text-sm text-slate-600"><i class="fas fa-plus-circle text-primary mr-1"></i> Tambah Jadwal Baru</h3>
                    <div class="space-y-3">
                        <div>
                            <label class="block text-xs font-medium mb-1">Judul Agenda</label>
                            <input type="text" id="j-judul" class="w-full border px-3 py-2 rounded-lg text-sm focus:ring-2 focus:ring-primary outline-none" placeholder="Cth: Bimbingan Tajwid">
                        </div>
                        <div class="grid grid-cols-2 gap-3">
                            <div>
                                <label class="block text-xs font-medium mb-1">Tipe</label>
                                <select id="j-tipe" class="w-full border px-3 py-2 rounded-lg text-sm focus:ring-2 focus:ring-primary outline-none">
                                    <option value="Bimbingan">Bimbingan</option>
                                    <option value="Kajian">Kajian</option>
                                </select>
                            </div>
                            <div>
                                <label class="block text-xs font-medium mb-1">Tanggal</label>
                                <input type="date" id="j-tanggal" class="w-full border px-3 py-2 rounded-lg text-sm focus:ring-2 focus:ring-primary outline-none">
                            </div>
                        </div>
                        <div class="grid grid-cols-2 gap-3">
                            <div>
                                <label class="block text-xs font-medium mb-1">Jam Mulai</label>
                                <input type="time" id="j-waktu" class="w-full border px-3 py-2 rounded-lg text-sm focus:ring-2 focus:ring-primary outline-none">
                            </div>
                            <div>
                                <label class="block text-xs font-medium mb-1">Jam Selesai</label>
                                <input type="time" id="j-waktu-selesai" class="w-full border px-3 py-2 rounded-lg text-sm focus:ring-2 focus:ring-primary outline-none">
                            </div>
                        </div>
                        <div>
                            <label class="block text-xs font-medium mb-1">Link Pamflet (Opsional)</label>
                            <input type="url" id="j-pamflet" class="w-full border px-3 py-2 rounded-lg text-sm focus:ring-2 focus:ring-primary outline-none" placeholder="https://...">
                        </div>
                        <div>
                            <label class="block text-xs font-medium mb-1">Link Zoom</label>
                            <input type="url" id="j-link" class="w-full border px-3 py-2 rounded-lg text-sm focus:ring-2 focus:ring-primary outline-none" placeholder="https://zoom.us/...">
                        </div>
                    </div>
                    <button onclick="addJadwal()" class="mt-4 w-full bg-slate-900 hover:bg-slate-800 text-white font-medium py-2.5 rounded-lg transition text-sm">
                        Simpan Jadwal
                    </button>
                </div>

                <!-- List Jadwal -->
                <div id="admin-jadwal-container" class="space-y-4">
                    <!-- Data jadwal dimuat via JS -->
                </div>
            </section>

            <!-- Tab: Kelola Video Kajian -->
            <section id="tab-video" class="hidden animate-fade-in">
                <h2 class="text-xl font-bold mb-4 text-slate-800 border-b pb-2">Kelola Video Kajian</h2>
                
                <!-- Form Tambah Video -->
                <div class="bg-white p-5 rounded-xl shadow-sm border mb-6">
                    <h3 class="font-bold mb-3 text-sm text-slate-600"><i class="fas fa-plus-circle text-primary mr-1"></i> Tambah Video</h3>
                    <div class="space-y-3">
                        <div>
                            <label class="block text-xs font-medium mb-1">Judul Video</label>
                            <input type="text" id="v-judul" class="w-full border px-3 py-2 rounded-lg text-sm focus:ring-2 focus:ring-primary outline-none" placeholder="Cth: Panduan Tahsin Al-Fatihah">
                        </div>
                        <div class="grid grid-cols-2 gap-3">
                            <div>
                                <label class="block text-xs font-medium mb-1">Kategori</label>
                                <select id="v-kategori" class="w-full border px-3 py-2 rounded-lg text-sm focus:ring-2 focus:ring-primary outline-none">
                                    <option value="Tahfidz">Tahfidz</option>
                                    <option value="Tahsin">Tahsin</option>
                                    <option value="Kajian">Kajian</option>
                                    <option value="Lainnya">Lainnya</option>
                                </select>
                            </div>
                            <div>
                                <label class="block text-xs font-medium mb-1">Tanggal Rilis</label>
                                <input type="date" id="v-tanggal" class="w-full border px-3 py-2 rounded-lg text-sm focus:ring-2 focus:ring-primary outline-none">
                            </div>
                        </div>
                        <div class="grid grid-cols-2 gap-3">
                            <div>
                                <label class="block text-xs font-medium mb-1">Durasi (Cth: 12:30)</label>
                                <input type="text" id="v-durasi" class="w-full border px-3 py-2 rounded-lg text-sm focus:ring-2 focus:ring-primary outline-none" placeholder="12:30">
                            </div>
                            <div>
                                <label class="block text-xs font-medium mb-1">Link Video (YT/Drive)</label>
                                <input type="url" id="v-url" class="w-full border px-3 py-2 rounded-lg text-sm focus:ring-2 focus:ring-primary outline-none" placeholder="https://...">
                            </div>
                        </div>
                        <div>
                            <label class="block text-xs font-medium mb-1">Link Thumbnail (Gambar)</label>
                            <input type="url" id="v-thumbnail" class="w-full border px-3 py-2 rounded-lg text-sm focus:ring-2 focus:ring-primary outline-none" placeholder="https://...">
                        </div>
                    </div>
                    <button id="btn-submit-video" onclick="addVideo()" class="mt-4 w-full bg-slate-900 hover:bg-slate-800 text-white font-medium py-2.5 rounded-lg transition text-sm">
                        Tambah Video
                    </button>
                </div>

                <!-- List Video -->
                <div id="admin-video-container" class="space-y-4">
                    <!-- Data video dimuat via JS -->
                </div>
            </section>

        </main>

        <!-- Bottom Navigation (Fixed for Mobile Layout) -->
        <nav class="fixed bottom-0 w-full max-w-md left-1/2 transform -translate-x-1/2 bg-white border-t flex justify-around items-center pb-safe z-50 shadow-[0_-4px_20px_rgba(0,0,0,0.08)] rounded-t-3xl px-2 pt-2 pb-1">
            <button onclick="switchTab('review')" id="nav-mobile-review" class="flex flex-col items-center p-2 text-primary w-full transition">
                <i class="fas fa-clipboard-check text-xl mb-1"></i>
                <span class="text-[10px] font-bold">Review</span>
            </button>
            
            <!-- Floating Action Button (FAB) Style for "Jadwal" -->
            <button onclick="switchTab('jadwal')" id="nav-mobile-jadwal" class="flex flex-col items-center p-2 text-slate-400 hover:text-primary w-full transition relative">
                <div class="absolute -top-7 bg-slate-900 text-white w-14 h-14 rounded-full flex items-center justify-center shadow-[0_4px_12px_rgba(15,23,42,0.4)] border-4 border-white transform transition duration-300">
                    <i class="fas fa-calendar-plus text-xl"></i>
                </div>
                <span class="text-[10px] font-bold mt-7">Jadwal</span>
            </button>
            
            <button onclick="switchTab('video')" id="nav-mobile-video" class="flex flex-col items-center p-2 text-slate-400 hover:text-primary w-full transition">
                <i class="fas fa-video text-xl mb-1"></i>
                <span class="text-[10px] font-bold">Video</span>
            </button>
        </nav>

    </div> <!-- End of Mobile App Container -->

    <!-- Notification Toast (Mobile Top Centered) -->
    <div id="toast" class="fixed top-16 left-1/2 transform -translate-x-1/2 w-[90%] max-w-sm bg-green-500 text-white px-5 py-3 rounded-2xl shadow-xl transition-all duration-300 -translate-y-[200%] opacity-0 z-[110] text-center flex items-center justify-center gap-2">
        <i class="fas fa-check-circle text-lg"></i>
        <span id="toast-message" class="font-medium text-sm">Notifikasi</span>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, onSnapshot, doc, setDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBgcwQR00n6uHSv1yypRqrpP6I7b1YwjIk",
            authDomain: "tahfidzonline-4d5bc.firebaseapp.com",
            projectId: "tahfidzonline-4d5bc",
            storageBucket: "tahfidzonline-4d5bc.firebasestorage.app",
            messagingSenderId: "752501441915",
            appId: "1:752501441915:web:5fd129d1d2661c31db69de"
        };
        
        // ID statis agar terhubung dengan aplikasi peserta
        const appId = 'tahfidz-app-global-v1';
        
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let currentUser = null;
        let state = { setoran: [], schedules: [], videos: [] };

        const initAuth = async () => {
            try {
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    try {
                        await signInWithCustomToken(auth, __initial_auth_token);
                    } catch (tokenError) {
                        console.warn("Beralih ke Anonim...", tokenError);
                        await signInAnonymously(auth);
                    }
                } else {
                    await signInAnonymously(auth);
                }
            } catch (e) {
                console.error("Auth error", e);
                window.showToast("Gagal terhubung ke database", "error");
            }
        };

        onAuthStateChanged(auth, (user) => {
            currentUser = user;
            if(user) setupListeners();
        });

        initAuth();

        function setupListeners() {
            if (!currentUser) return;
            
            onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'setoran'), (snap) => {
                state.setoran = snap.docs.map(d => ({id: d.id, ...d.data()}));
                if(document.getElementById('tab-review').classList.contains('block')) renderSetoran();
            }, (e) => console.error(e));

            onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'schedules'), (snap) => {
                state.schedules = snap.docs.map(d => ({id: d.id, ...d.data()}));
                if(document.getElementById('tab-jadwal').classList.contains('block')) renderJadwal();
            }, (e) => console.error(e));

            onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'videos'), (snap) => {
                state.videos = snap.docs.map(d => ({id: d.id, ...d.data()}));
                if(document.getElementById('tab-video').classList.contains('block')) renderVideo();
            }, (e) => console.error(e));
        }

        // --- Navigasi Mobile ---
        window.switchTab = function(tabId) {
            document.querySelectorAll('section').forEach(sec => {
                sec.classList.remove('block');
                sec.classList.add('hidden');
            });
            document.getElementById(`tab-${tabId}`).classList.remove('hidden');
            document.getElementById(`tab-${tabId}`).classList.add('block');

            const navs = ['review', 'jadwal', 'video'];
            navs.forEach(nav => {
                const el = document.getElementById(`nav-mobile-${nav}`);
                if(nav === tabId) {
                    if(nav === 'jadwal') {
                        el.classList.add('text-slate-900'); el.classList.remove('text-slate-400');
                    } else {
                        el.classList.add('text-primary'); el.classList.remove('text-slate-400');
                    }
                } else {
                    el.classList.remove('text-primary', 'text-slate-900'); el.classList.add('text-slate-400');
                }
            });

            if(tabId === 'review') renderSetoran();
            if(tabId === 'jadwal') renderJadwal();
            if(tabId === 'video') renderVideo();
        };

        window.loadSetoran = function() { renderSetoran(); };

        // --- Render Data (Disesuaikan untuk lebar HP) ---
        function renderSetoran() {
            const container = document.getElementById('admin-setoran-container');
            const sortedSetoran = [...state.setoran].sort((a,b) => Number(b.id) - Number(a.id));

            if(sortedSetoran.length === 0) {
                container.innerHTML = `<div class="p-8 text-center bg-white rounded-xl shadow-sm border text-gray-400">Belum ada setoran masuk.</div>`;
                return;
            }

            container.innerHTML = sortedSetoran.map(s => `
                <div class="bg-white p-4 rounded-xl shadow-sm border flex flex-col gap-3">
                    <div class="flex justify-between items-start">
                        <div>
                            <h3 class="font-bold text-base text-slate-800">${s.user}</h3>
                            <p class="text-sm text-slate-600 font-medium">${s.surah}</p>
                            <p class="text-[10px] text-slate-400 mt-1"><i class="far fa-clock"></i> ${s.date}</p>
                        </div>
                        <span class="px-2 py-1 rounded text-[10px] font-bold text-white shadow-sm
                            ${s.status === 'Menunggu Review' ? 'bg-yellow-500' : 
                              s.status === 'Diterima' ? 'bg-green-500' : 'bg-red-500'}">
                            ${s.status}
                        </span>
                    </div>
                    
                    <div class="w-full">
                        <audio src="${s.audioBase64}" controls class="w-full h-10 mb-3"></audio>
                        
                        ${s.status === 'Menunggu Review' ? `
                            <div class="flex gap-2 w-full">
                                <button onclick="updateSetoranStatus('${s.id}', 'Diterima')" class="flex-1 bg-green-500 hover:bg-green-600 text-white px-3 py-2 rounded-lg shadow transition text-sm font-medium">
                                    <i class="fas fa-check mr-1"></i> Terima
                                </button>
                                <button onclick="updateSetoranStatus('${s.id}', 'Perlu Perbaikan')" class="flex-1 bg-red-500 hover:bg-red-600 text-white px-3 py-2 rounded-lg shadow transition text-sm font-medium">
                                    <i class="fas fa-times mr-1"></i> Tolak
                                </button>
                            </div>
                        ` : `
                            <button onclick="deleteSetoran('${s.id}')" class="w-full text-red-500 bg-red-50 hover:bg-red-100 px-3 py-2 rounded-lg transition text-sm font-medium border border-red-100">
                                <i class="fas fa-trash mr-1"></i> Hapus Rekaman
                            </button>
                        `}
                    </div>
                </div>
            `).join('');
        }

        window.updateSetoranStatus = async function(id, newStatus) {
            if (!currentUser) return;
            try {
                await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'setoran', id), { status: newStatus }, { merge: true });
                window.showToast(`Status diubah menjadi: ${newStatus}`);
            } catch (e) {
                window.showToast("Gagal mengubah status", "error");
            }
        };

        window.deleteSetoran = async function(id) {
            if (!currentUser) return;
            if(confirm("Yakin ingin menghapus rekaman ini?")) {
                try {
                    await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'setoran', id));
                    window.showToast("Setoran dihapus");
                } catch (e) {
                    window.showToast("Gagal menghapus", "error");
                }
            }
        };

        function renderJadwal() {
            const container = document.getElementById('admin-jadwal-container');
            if(state.schedules.length === 0) {
                container.innerHTML = `<div class="p-6 text-center bg-white border rounded-xl text-gray-400 text-sm">Jadwal masih kosong.</div>`;
                return;
            }
            container.innerHTML = state.schedules.map(j => `
                <div class="bg-white p-4 rounded-xl shadow-sm border relative">
                    <button onclick="deleteJadwal('${j.id}')" class="absolute top-3 right-3 text-red-400 hover:text-red-600 bg-red-50 p-2 rounded-lg transition">
                        <i class="fas fa-trash"></i>
                    </button>
                    <span class="text-[10px] font-bold text-white px-2 py-0.5 rounded shadow-sm mb-2 inline-block ${j.type === 'Kajian' ? 'bg-primary' : 'bg-emerald-500'}">${j.type}</span>
                    <h4 class="font-bold text-base mb-1 pr-8 text-slate-800 leading-tight">${j.title}</h4>
                    <p class="text-xs text-slate-500"><i class="far fa-calendar-alt w-4"></i> ${j.date}</p>
                    <p class="text-xs text-slate-500"><i class="far fa-clock w-4"></i> ${j.time} WIB</p>
                    <a href="${j.link}" target="_blank" class="text-xs text-primary font-medium mt-2 block truncate"><i class="fas fa-link w-4"></i> ${j.link}</a>
                </div>
            `).join('');
        }

        window.addJadwal = async function() {
            if (!currentUser) return;
            const title = document.getElementById('j-judul').value;
            const type = document.getElementById('j-tipe').value;
            const date = document.getElementById('j-tanggal').value;
            const time = document.getElementById('j-waktu').value;
            const timeEnd = document.getElementById('j-waktu-selesai').value;
            const link = document.getElementById('j-link').value;
            const pamflet = document.getElementById('j-pamflet').value;

            if(!title || !date || !time || !link) return window.showToast("Harap isi kolom wajib jadwal!", "error");

            try {
                const id = Date.now().toString();
                await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'schedules', id), { title, type, date, time, timeEnd, link, pamflet });
                
                document.getElementById('j-judul').value = '';
                document.getElementById('j-tanggal').value = '';
                document.getElementById('j-waktu').value = '';
                document.getElementById('j-waktu-selesai').value = '';
                document.getElementById('j-link').value = '';
                document.getElementById('j-pamflet').value = '';
                window.showToast("Jadwal ditambahkan");
            } catch (e) {
                window.showToast("Gagal menyimpan jadwal", "error");
            }
        };

        window.deleteJadwal = async function(id) {
            if (!currentUser) return;
            if(confirm("Hapus jadwal ini?")) {
                try {
                    await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'schedules', id));
                    window.showToast("Jadwal dihapus");
                } catch (e) {
                    window.showToast("Gagal menghapus", "error");
                }
            }
        };

        function renderVideo() {
            const container = document.getElementById('admin-video-container');
            if(state.videos.length === 0) {
                container.innerHTML = `<div class="p-6 text-center bg-white border rounded-xl text-gray-400 text-sm">Video masih kosong.</div>`;
                return;
            }
            container.innerHTML = state.videos.map(v => `
                <div class="bg-white rounded-xl overflow-hidden shadow-sm border relative flex flex-col">
                    <div class="absolute top-2 right-2 flex gap-1 z-10">
                        <button onclick="editVideo('${v.id}')" class="bg-blue-50 text-blue-500 hover:text-blue-700 p-2 rounded-lg transition shadow-sm">
                            <i class="fas fa-edit text-sm"></i>
                        </button>
                        <button onclick="deleteVideo('${v.id}')" class="bg-red-50 text-red-500 hover:text-red-700 p-2 rounded-lg transition shadow-sm">
                            <i class="fas fa-trash text-sm"></i>
                        </button>
                    </div>
                    <div class="h-32 w-full bg-slate-200 relative">
                        <img src="${v.thumbnail || 'https://images.unsplash.com/photo-1609599006353-e629aaab31f5?ixlib=rb-4.0.3&auto=format&fit=crop&w=800&q=80'}" class="w-full h-full object-cover">
                        <div class="absolute bottom-2 right-2 bg-black/70 text-white text-[10px] font-bold px-2 py-1 rounded">
                            ${v.durasi || '00:00'}
                        </div>
                    </div>
                    <div class="p-3">
                        <span class="text-[10px] font-bold text-white px-2 py-0.5 rounded shadow-sm mb-1 inline-block ${v.kategori === 'Tahfidz' ? 'bg-emerald-500' : v.kategori === 'Tahsin' ? 'bg-blue-500' : 'bg-slate-800'}">${v.kategori || 'Kajian'}</span>
                        <h4 class="font-bold text-sm text-slate-800 leading-snug line-clamp-2">${v.title}</h4>
                        <p class="text-[10px] text-slate-500 mt-1"><i class="far fa-calendar-alt"></i> ${v.tanggal || '-'}</p>
                        <a href="${v.url}" target="_blank" class="text-[10px] text-primary font-medium mt-2 block truncate"><i class="fas fa-link"></i> ${v.url}</a>
                    </div>
                </div>
            `).join('');
        }

        let editVideoId = null;

        window.editVideo = function(id) {
            const video = state.videos.find(v => v.id === id);
            if (!video) return;

            document.getElementById('v-judul').value = video.title || '';
            document.getElementById('v-kategori').value = video.kategori || 'Tahfidz';
            document.getElementById('v-tanggal').value = video.tanggal || '';
            document.getElementById('v-durasi').value = video.durasi || '';
            document.getElementById('v-url').value = video.url || '';
            document.getElementById('v-thumbnail').value = video.thumbnail || '';

            editVideoId = id;
            const btn = document.getElementById('btn-submit-video');
            btn.innerText = "Simpan Perubahan";
            btn.classList.replace('bg-slate-900', 'bg-blue-600');
            btn.classList.replace('hover:bg-slate-800', 'hover:bg-blue-700');
            
            // Scroll ke atas agar form terlihat di layar HP
            document.querySelector('main').scrollTo({ top: 0, behavior: 'smooth' });
            window.scrollTo({ top: 0, behavior: 'smooth' });
        };

        window.addVideo = async function() {
            if (!currentUser) return;
            const title = document.getElementById('v-judul').value;
            const kategori = document.getElementById('v-kategori').value;
            const tanggal = document.getElementById('v-tanggal').value;
            const durasi = document.getElementById('v-durasi').value;
            const url = document.getElementById('v-url').value;
            const thumbnail = document.getElementById('v-thumbnail').value;

            if(!title || !url || !tanggal) return window.showToast("Harap isi judul, tanggal, dan URL video!", "error");

            try {
                const videoData = { title, kategori, tanggal, durasi, url, thumbnail };

                if (editVideoId) {
                    await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'videos', editVideoId), videoData, { merge: true });
                    window.showToast("Video berhasil diupdate");
                } else {
                    const id = Date.now().toString();
                    await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'videos', id), videoData);
                    window.showToast("Video ditambahkan");
                }
                
                // Clear form
                document.getElementById('v-judul').value = '';
                document.getElementById('v-kategori').value = 'Tahfidz';
                document.getElementById('v-tanggal').value = '';
                document.getElementById('v-durasi').value = '';
                document.getElementById('v-url').value = '';
                document.getElementById('v-thumbnail').value = '';

                // Reset state edit
                editVideoId = null;
                const btn = document.getElementById('btn-submit-video');
                btn.innerText = "Tambah Video";
                btn.classList.replace('bg-blue-600', 'bg-slate-900');
                btn.classList.replace('hover:bg-blue-700', 'hover:bg-slate-800');
                
            } catch (e) {
                window.showToast("Gagal menyimpan video", "error");
            }
        };

        window.deleteVideo = async function(id) {
            if (!currentUser) return;
            if(confirm("Hapus video ini?")) {
                try {
                    await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'videos', id));
                    window.showToast("Video dihapus");
                } catch (e) {
                    window.showToast("Gagal menghapus", "error");
                }
            }
        };

        window.showToast = function(msg, type="success") {
            const toast = document.getElementById('toast');
            document.getElementById('toast-message').innerText = msg;
            
            if(type === "error") {
                toast.classList.replace('bg-green-500', 'bg-red-500');
                toast.querySelector('i').className = 'fas fa-exclamation-circle text-lg';
            } else {
                toast.classList.replace('bg-red-500', 'bg-green-500');
                toast.querySelector('i').className = 'fas fa-check-circle text-lg';
            }

            toast.classList.remove('-translate-y-[200%]', 'opacity-0');
            setTimeout(() => {
                toast.classList.add('-translate-y-[200%]', 'opacity-0');
            }, 3000);
        };
    </script>
</body>
</html>
